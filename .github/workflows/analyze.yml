name: FoodSense Food Analysis

on:
  repository_dispatch:
    types: [analyze-food]

run-name: "analyze-${{ github.event.client_payload.job_id }}"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run food analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          GIST_ID: ${{ github.event.client_payload.gist_id }}
          CONDITION: ${{ github.event.client_payload.condition }}
          USER_ALLERGIES: ${{ github.event.client_payload.user_allergies }}
          DIABETES_TYPE: ${{ github.event.client_payload.diabetes_type }}
          HYPERTENSION_SEVERITY: ${{ github.event.client_payload.hypertension_severity }}
        run: python backend/gh_worker.py

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ github.event.client_payload.job_id }}
          path: result.json
          retention-days: 1
